<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Payment Cancelled | Desi Taste</title>
    <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-background min-h-screen flex items-center justify-center p-6 silk-texture">
    <div class="max-w-md w-full glass-premium p-8 md:p-10 text-center relative border border-secondary/20 rounded-[28px]">
        <div class="menu-card-border-detail"></div>

        <!-- Cancel Animated Circle -->
        <div class="w-20 h-20 bg-secondary/10 border border-secondary/20 rounded-full flex items-center justify-center mx-auto mb-6 text-secondary shadow-[0_4px_20px_rgba(176,137,48,0.15)]">
            <span class="material-symbols-outlined text-4xl">info</span>
        </div>

        <span class="font-logo-font text-gold text-2xl block mb-1 font-semibold select-none">Process Paused</span>
        <h1 class="font-headline-md text-2xl text-on-surface mb-3 font-semibold">Payment Cancelled</h1>

        <p class="text-xs text-on-surface-variant leading-relaxed mb-8 font-light max-w-sm mx-auto">
            Your payment session has been cancelled. No charges or holds have been made to your payment card. If you experienced any difficulty, please try again or call the restaurant directly.
        </p>

        <div class="flex flex-col gap-3">
            <a href="payment.html" class="btn-luxury btn-sheen w-full flex items-center justify-center gap-2">
                <span>Try Payment Again</span>
                <span class="material-symbols-outlined text-sm">payments</span>
            </a>
            <a href="index.html#home" class="btn-luxury-secondary-light w-full py-3 rounded-full flex items-center justify-center gap-2 text-xs">
                <span>Back to Home</span>
            </a>
        </div>
    </div>
</body>

</html>
