<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Payment Successful | Desi Taste</title>
    <link rel="icon" type="image/jpeg" href="images/logo.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-background min-h-screen flex items-center justify-center p-6 silk-texture">
    <div class="max-w-md w-full glass-premium p-8 md:p-10 text-center relative border border-green-500/20 rounded-[28px]">
        <div class="menu-card-border-detail"></div>

        <!-- Success Animated Circle -->
        <div class="w-20 h-20 bg-green-500/10 border border-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600 shadow-[0_4px_20px_rgba(34,197,94,0.15)]">
            <span class="material-symbols-outlined text-4xl animate-bounce">check_circle</span>
        </div>

        <span class="font-logo-font text-gold text-2xl block mb-1 font-semibold select-none">Dhanyavad (Thank You)</span>
        <h1 class="font-headline-md text-2xl text-on-surface mb-3 font-semibold">Payment Successful</h1>
        
        <!-- Dynamically Parsed Amount Box -->
        <div id="amount-box" class="hidden my-4 py-3 px-5 bg-green-500/5 border border-green-500/10 rounded-2xl inline-block">
            <span class="text-[10px] font-label-md text-secondary uppercase tracking-widest font-bold block">Amount Received</span>
            <span id="paid-amount" class="text-2xl font-bold text-on-surface">€0.00</span>
        </div>

        <p class="text-xs text-on-surface-variant leading-relaxed mb-8 font-light max-w-sm mx-auto">
            Your transaction has been processed securely. A confirmation receipt will be sent directly to the email address you provided during checkout.
        </p>

        <a href="index.html#home" class="btn-luxury btn-sheen w-full flex items-center justify-center gap-2">
            <span>Return to Home</span>
            <span class="material-symbols-outlined text-sm">home</span>
        </a>
    </div>

    <!-- Inline Script to parse the query amount -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const amount = params.get('amount');
            if (amount) {
                const paidAmountEl = document.getElementById('paid-amount');
                const amountBoxEl = document.getElementById('amount-box');
                
                // Format the amount nicely
                const formatted = parseFloat(amount).toFixed(2);
                paidAmountEl.innerText = `€${formatted}`;
                amountBoxEl.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
